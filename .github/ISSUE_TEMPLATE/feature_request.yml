name: Feature request
description: Suggest an improvement to an existing skill.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - upscaler-ask
        - upscaler-author-asset
        - upscaler-write-entry
        - upscaler-run-record
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
