name: Propose a new skill
description: Ask for a skill that lets an agent do a new task in Upscaler.
title: "[new-skill] "
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What do you want an agent to do in Upscaler?
      placeholder: Show all open risks that have no owner and draft a reminder for each.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: Why the current skills do not cover it
      description: The current skills are upscaler-ask, upscaler-author-asset, upscaler-write-entry and upscaler-run-record.
    validations:
      required: true
  - type: textarea
    id: triggers
    attributes:
      label: Example prompts that should trigger the skill
      placeholder: |
        - "show me all open risks"
        - "add a risk register entry for vendor X"
    validations:
      required: false
  - type: input
    id: name
    attributes:
      label: Suggested skill name (kebab-case)
      placeholder: upscaler-risk-review
    validations:
      required: false
  - type: checkboxes
    id: willing
    attributes:
      label: Are you willing to contribute this skill?
      options:
        - label: I plan to open a pull request for this skill.
